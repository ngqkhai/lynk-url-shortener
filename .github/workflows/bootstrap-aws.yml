name: Bootstrap AWS host
on:
  workflow_dispatch:
    inputs:
      check:
        description: Inspect changes without applying
        type: boolean
        default: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: lynk-aws-deployment
  cancel-in-progress: false
jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    environment: aws-bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BOOTSTRAP_ROLE_ARN }}
          aws-region: ap-southeast-1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - name: Initialize read-only inventory backend
        env:
          TF_WORKSPACE: default
        run: terraform -chdir=infra/terraform/environments/aws-demo init -input=false -lockfile=readonly -backend-config=../../backends/aws-demo.s3.tfbackend
      - name: Install Ansible and SSM plugin
        run: |
          pip install -r infra/ansible/requirements.txt
          ansible-galaxy collection install -r infra/ansible/requirements.yml
          python3 scripts/ansible/install-ssm-plugin.py --prefix /tmp/lynk-controller
      - name: Configure host from Vault using SSM
        env:
          CHECK: ${{ inputs.check }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          args=()
          if [[ "$CHECK" == true ]]; then args+=(--check); fi
          python3 scripts/ansible/bootstrap.py --password-env ANSIBLE_VAULT_PASSWORD "${args[@]}"
