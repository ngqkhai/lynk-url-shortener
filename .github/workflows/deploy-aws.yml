name: Deploy AWS
on:
  workflow_call:
    inputs:
      release-sha: { type: string, required: true }
      upload-artifact: { type: boolean, default: false }
  workflow_dispatch:
    inputs:
      release-sha:
        description: Successful main commit SHA (40 hexadecimal characters)
        required: true
        type: string
      action:
        type: choice
        options: [deploy, rollback]
        default: deploy
      revision:
        description: Successful Helm revision for rollback; 0 for deploy
        default: '0'
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: lynk-aws-deployment
  cancel-in-progress: false
jobs:
  deployment-policy:
    name: Deployment mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment mode
        id: mode
        env:
          LYNK_DEPLOY_MODE: ${{ vars.LYNK_DEPLOY_MODE || 'paused' }}
        run: python3 scripts/cd/deployment-mode.py

  deploy:
    needs: deployment-policy
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.deployment-policy.outputs.mode == 'ssm'
    runs-on: ubuntu-latest
    environment: aws-demo
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Recheck mode before obtaining AWS credentials
        env:
          LYNK_DEPLOY_MODE: ${{ vars.LYNK_DEPLOY_MODE || 'paused' }}
        run: python3 scripts/cd/deployment-mode.py --require-ssm
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-duration-seconds: 4200
      - uses: actions/download-artifact@v4
        if: inputs.upload-artifact
        with:
          name: release
          path: release-upload
      - name: Upload release and invoke bounded SSM deployment
        env:
          RELEASE_SHA: ${{ inputs.release-sha }}
          DEPLOY_ACTION: ${{ inputs.action || 'deploy' }}
          HELM_REVISION: ${{ inputs.revision || '0' }}
          UPLOAD_RELEASE: ${{ inputs.upload-artifact }}
          ARTIFACT_BUCKET: ${{ vars.AWS_ARTIFACT_BUCKET }}
          INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
        run: python3 scripts/cd/invoke-ssm.py
