name: CI & Docker Build

on:
  push:
    branches: [main, 'checkpoint/**']
  pull_request:
    branches: [main]

jobs:
  deployment-policy:
    name: Deployment mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment mode (missing configuration pauses delivery)
        id: mode
        env:
          LYNK_DEPLOY_MODE: ${{ vars.LYNK_DEPLOY_MODE || 'paused' }}
        run: python3 scripts/cd/deployment-mode.py

  # ─── Lint & Test (runs on all branches) ──────────────────────────────────────
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Deployment failure scenarios
        run: |
          python3 scripts/cd/test-deploy.py
          python3 scripts/cd/test-deployment-mode.py

      - name: Run tests
        run: npm run test
        env:
          RUN_INTEGRATION_TESTS: true

  gateway-e2e:
    name: Phantom gateway & Kafka resilience
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: End-to-end Sprint 3A
        run: bash scripts/test-sprint3a.sh

  automation-checks:
    name: Infrastructure and Helm checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate automation
        run: |
          pip install -r infra/ansible/requirements.txt cfn-lint==1.57.2
          ansible-galaxy collection install -r infra/ansible/requirements.yml
          python3 scripts/ansible/test-bootstrap.py
          python3 scripts/ansible/test-rotate-mtls.py
          python3 scripts/backups/test-lynk-db-backup.py
          python3 scripts/cd/test_image_build_inputs.py
          python3 scripts/cd/test_promote_release.py
          python3 scripts/cd/test_promotion_guard.py
          python3 scripts/cd/test_wait_argocd_status.py
          python3 scripts/cd/test_argocd_status_automation.py
          python3 scripts/cd/test_compare_aws_demo_adoption.py
          ansible-playbook -i infra/ansible/inventory.yml infra/ansible/bootstrap.yml --syntax-check
          ansible-playbook -i infra/ansible/inventory.yml infra/ansible/argocd.yml --syntax-check
          ansible-playbook -i infra/ansible/inventory.yml infra/ansible/argocd-applications.yml --syntax-check
          ansible-playbook -i infra/ansible/inventory.yml infra/ansible/argocd-application-aws-demo-branch.yml --syntax-check
          ansible-playbook -i infra/ansible/inventory.yml infra/ansible/argocd-status.yml --syntax-check
          ansible-playbook -i infra/ansible/inventory.yml infra/ansible/restore-aws-demo-single-source.yml --syntax-check
          for playbook in infra/ansible/cp16-*.yml infra/ansible/cp17-*.yml; do
            ansible-playbook -i infra/ansible/inventory.yml "$playbook" --syntax-check
          done
          python3 scripts/cd/test-workflow-gates.py
          python3 scripts/secrets/vault-bundle.py check
          python3 scripts/secrets/test-vault-bundle.py
          python3 scripts/secrets/test-mtls-pki.py
          ansible-playbook -i infra/ansible/inventory.yml infra/ansible/rotate-mtls.yml --syntax-check
          cfn-lint infra/aws/stack.yaml infra/aws/automation.yaml
          bash -n scripts/cd/deploy.sh scripts/cd/argocd-status.sh scripts/bootstrap-aws-platform.sh
          curl -fsS https://get.helm.sh/helm-v3.21.2-linux-amd64.tar.gz -o /tmp/helm.tar.gz
          tar -xzf /tmp/helm.tar.gz -C /tmp
          /tmp/linux-amd64/helm lint infra/k8s/helm/lynk-services -f infra/k8s/helm/lynk-services/values-aws.yaml
          /tmp/linux-amd64/helm lint infra/k8s/helm/lynk-services -f infra/k8s/helm/lynk-services/values-aws.yaml -f infra/k8s/helm/lynk-services/values-aws-demo.yaml
          HELM_BINARY=/tmp/linux-amd64/helm python3 scripts/cd/test-aws-demo-chart.py

  gitops-checks:
    name: GitOps manifest checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate declared Applications independently of delivery
        run: |
          pip install PyYAML==6.0.3
          python3 scripts/cd/check-gitops.py
          python3 scripts/cd/test-argocd-overlay.py
          python3 scripts/cd/test-gitops-aws-demo.py

  terraform-checks:
    name: Terraform format and validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - name: Validate roots without AWS credentials or backend access
        run: |
          python3 scripts/terraform/test-migration-guards.py
          terraform fmt -check -recursive infra/terraform
          for root in infra/terraform/bootstrap infra/terraform/environments/aws-demo; do
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate
          done

  image-inputs:
    name: Detect image build inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build_images: ${{ steps.classify.outputs.build_images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify files changed by this event
        id: classify
        env:
          IMAGE_DIFF_BASE: ${{ github.event.before || github.event.pull_request.base.sha || '' }}
          IMAGE_DIFF_HEAD: ${{ github.sha }}
        run: python3 scripts/cd/image_build_inputs.py --base "$IMAGE_DIFF_BASE" --head "$IMAGE_DIFF_HEAD"

  build-and-push:
    name: Publish immutable images
    needs:
      [lint-and-test, gateway-e2e, automation-checks, gitops-checks, terraform-checks, image-inputs]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.image-inputs.outputs.build_images == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [url, redirect, auth]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: services/${{ matrix.service }}-service/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: RELEASE_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/ngqkhai/lynk-url-shortener
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ghcr.io/ngqkhai/lynk-${{ matrix.service }}-service:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Record digest
        env:
          SERVICE: ${{ matrix.service }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          service=os.environ['SERVICE']
          with open(service+'.json','w') as f:
              json.dump({'repository':'ghcr.io/ngqkhai/lynk-'+service+'-service','digest':os.environ['DIGEST']},f)
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: ${{ matrix.service }}.json

  package-release:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
          path: image-metadata
      - name: Package release
        env:
          COMMIT: ${{ github.sha }}
        run: |
          python3 scripts/cd/package-release.py --sha "$COMMIT" --metadata image-metadata --output release
          tar -czf release.tar.gz -C release .
          sha256sum release.tar.gz > release.sha256
      - name: Verify images can be pulled anonymously
        run: |
          mkdir -p /tmp/lynk-anonymous-docker
          python3 - <<'PYCODE'
          import json, subprocess
          manifest=json.load(open('release/release.json'))
          for value in manifest['images'].values():
              image=value['image']
              ref=image['repository']+'@'+image['digest']
              subprocess.run(['docker','--config','/tmp/lynk-anonymous-docker','manifest','inspect',ref],check=True,stdout=subprocess.DEVNULL)
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            release.tar.gz
            release.sha256

  deploy:
    needs: [package-release, deployment-policy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.deployment-policy.outputs.mode == 'ssm'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-aws.yml
    with:
      release-sha: ${{ github.sha }}
      upload-artifact: true

  promote-release:
    name: Promote immutable release to aws-demo GitOps
    needs: [package-release, deployment-policy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.deployment-policy.outputs.mode == 'argocd'
    runs-on: ubuntu-latest
    environment: aws-demo
    concurrency:
      group: lynk-argocd-promotion
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release-artifact
      - name: Verify release archive and extracted manifest
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cd release-artifact
          sha256sum --check release.sha256
          mkdir extracted
          tar -xzf release.tar.gz -C extracted
          python3 - "$SOURCE_SHA" extracted/release.json <<'PYCODE'
          import json, sys
          sys.path.insert(0, '../scripts/cd')
          from promote_release import validate_release
          validate_release(json.load(open(sys.argv[2])), sys.argv[1])
          PYCODE
      - name: Reject stale source, stage one file and push without force
        id: promotion
        env:
          SOURCE_SHA: ${{ github.sha }}
          CHART_SHA: 87eb22600c545ac6952d472739b0091f5bd84281
        run: |
          git fetch origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          python3 "$GITHUB_WORKSPACE/scripts/cd/promotion_guard.py" --source-sha "$SOURCE_SHA" --main-sha "$MAIN_SHA"
          git fetch origin aws-demo
          git worktree add --detach /tmp/lynk-aws-demo origin/aws-demo
          cd /tmp/lynk-aws-demo
          DEPLOYMENT_BASE="$(git rev-parse HEAD)"
          python3 "$GITHUB_WORKSPACE/scripts/cd/promotion_guard.py" --source-sha "$SOURCE_SHA" --main-sha "$MAIN_SHA" --chart-sha "$CHART_SHA" --deployment-sha "$DEPLOYMENT_BASE"
          python3 "$GITHUB_WORKSPACE/scripts/cd/promote_release.py" --repository-root /tmp/lynk-aws-demo --release-json "$GITHUB_WORKSPACE/release-artifact/extracted/release.json" --values infra/k8s/helm/lynk-services/values-aws-demo.yaml --expected-sha "$SOURCE_SHA"
          git add -- infra/k8s/helm/lynk-services/values-aws-demo.yaml
          python3 "$GITHUB_WORKSPACE/scripts/cd/promotion_guard.py" --source-sha "$SOURCE_SHA" --main-sha "$MAIN_SHA" --chart-sha "$CHART_SHA" --deployment-sha "$DEPLOYMENT_BASE" --check-staged
          if git diff --cached --quiet; then
            echo "promotion_sha=$DEPLOYMENT_BASE" >> "$GITHUB_OUTPUT"
            echo "promotion_created=false" >> "$GITHUB_OUTPUT"
            echo "Promotion already contains these exact digests."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "chore(gitops): promote aws-demo ${SOURCE_SHA}"
          PROMOTION_SHA="$(git rev-parse HEAD)"
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          python3 scripts/cd/promotion_guard.py --source-sha "$SOURCE_SHA" --main-sha "$CURRENT_MAIN"
          git push origin HEAD:aws-demo
          echo "promotion_sha=$PROMOTION_SHA" >> "$GITHUB_OUTPUT"
          echo "promotion_created=true" >> "$GITHUB_OUTPUT"
      - name: Configure least-privilege AWS status role
        if: steps.promotion.outputs.promotion_sha != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_STATUS_ROLE_ARN }}
          aws-region: ap-southeast-1
      - name: Request read-only Argo release status
        if: steps.promotion.outputs.promotion_sha != ''
        env:
          RELEASE_SHA: ${{ github.sha }}
          VALUES_REVISION: ${{ steps.promotion.outputs.promotion_sha }}
          INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
          AWS_REGION: ap-southeast-1
        run: python3 scripts/cd/wait-argocd-status.py
      - name: Restore desired values if status verification failed (deployment remains failed)
        if: failure() && steps.promotion.outputs.promotion_created == 'true'
        env:
          PROMOTION_SHA: ${{ steps.promotion.outputs.promotion_sha }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git fetch origin aws-demo main
          git worktree add --detach /tmp/lynk-aws-demo-rollback origin/aws-demo
          cd /tmp/lynk-aws-demo-rollback
          CURRENT_DEPLOYMENT="$(git rev-parse HEAD)"
          CURRENT_MAIN="$(git rev-parse origin/main)"
          if [ "$CURRENT_DEPLOYMENT" != "$PROMOTION_SHA" ] || [ "$CURRENT_MAIN" != "$SOURCE_SHA" ]; then
            echo "Cannot safely revert: aws-demo or main advanced; operator reconciliation required." >&2
            exit 1
          fi
          git checkout --detach "$PROMOTION_SHA"
          git revert --no-edit "$PROMOTION_SHA"
          git push origin HEAD:aws-demo
          echo "Desired values were reverted; deployment verification remains failed." >&2
