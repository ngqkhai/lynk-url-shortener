AWSTemplateFormatVersion: '2010-09-09'
Description: Lynk single-node EC2 K3s experiment (t3.small, Free Plan)
Parameters:
  ImageId:
    Type: AWS::EC2::Image::Id
  K3sVersion:
    Type: String
    Default: v1.37.1+k3s1
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.70.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Project, Value: lynk }]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway
  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.70.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  InternetRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref Subnet, RouteTableId: !Ref RouteTable }
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP/HTTPS only; administration through SSM
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns: [arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore]
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: { Roles: [!Ref InstanceRole] }
  Instance:
    Type: AWS::EC2::Instance
    DependsOn: InternetRoute
    Properties:
      ImageId: !Ref ImageId
      InstanceType: t3.small
      CreditSpecification: { CPUCredits: standard }
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref Subnet
      SecurityGroupIds: [!Ref SecurityGroup]
      MetadataOptions: { HttpTokens: required, HttpPutResponseHopLimit: 1 }
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs: { VolumeType: gp3, VolumeSize: 30, Encrypted: true, DeleteOnTermination: false }
      Tags:
        - { Key: Name, Value: lynk-k3s-dev }
        - { Key: Project, Value: lynk }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          # Wait for the Elastic IP to be attached before fetching dependencies.
          for attempt in $(seq 1 120); do
            if curl -fsS --connect-timeout 3 https://get.k3s.io -o /tmp/install-k3s.sh; then break; fi
            sleep 5
          done
          apt-get update
          apt-get install -y curl ca-certificates jq git unzip
          snap start amazon-ssm-agent || true
          mkdir -p /etc/rancher/k3s
          cat > /etc/rancher/k3s/config.yaml <<'CONFIG'
          write-kubeconfig-mode: "0600"
          disable:
            - traefik
            - servicelb
          secrets-encryption: true
          node-label:
            - ingress-ready=true
          CONFIG
          INSTALL_K3S_VERSION='${K3sVersion}' sh /tmp/install-k3s.sh
          curl -fsS https://get.helm.sh/helm-v3.21.2-linux-amd64.tar.gz -o /tmp/helm.tar.gz
          tar -xzf /tmp/helm.tar.gz -C /tmp
          install /tmp/linux-amd64/helm /usr/local/bin/helm
          mkdir -p /opt/lynk
          chmod 700 /opt/lynk
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - {
              Id: ExpireDeploymentArtifacts,
              Prefix: artifacts/,
              Status: Enabled,
              ExpirationInDays: 7,
            }
          - {
              Id: ExpireDeploymentLogs,
              Prefix: deploy-logs/,
              Status: Enabled,
              ExpirationInDays: 14,
            }
      Tags: [{ Key: Project, Value: lynk }]
  ElasticIp:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties:
      Domain: vpc
      Tags: [{ Key: Project, Value: lynk }]
  IpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties: { InstanceId: !Ref Instance, AllocationId: !GetAtt ElasticIp.AllocationId }
Outputs:
  InstanceId: { Value: !Ref Instance }
  PublicIp: { Value: !Ref ElasticIp }
  VpcId: { Value: !Ref Vpc }
  SubnetId: { Value: !Ref Subnet }
  SecurityGroupId: { Value: !Ref SecurityGroup }
  ArtifactBucket: { Value: !Ref ArtifactBucket }
