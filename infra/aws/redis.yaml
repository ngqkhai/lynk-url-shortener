apiVersion: v1
kind: Service
metadata:
  name: lynk-redis-master
spec:
  selector:
    app: lynk-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lynk-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lynk-redis
  template:
    metadata:
      labels:
        app: lynk-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: redis
          image: redis:8-alpine
          command: [/bin/sh, -ec]
          args:
            - 'exec redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --requirepass "$REDIS_PASSWORD" --save "" --appendonly no'
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lynk-redis-auth
                  key: redis-password
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: lynk-redis-auth
                  key: redis-password
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [redis-cli, ping]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
