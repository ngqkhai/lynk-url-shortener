http:
  routers:
    urls:
      rule: PathPrefix(`/api/v1/urls`)
      entryPoints: [web]
      middlewares: [phantom]
      service: urls
    me:
      rule: Path(`/api/v1/auth/me`)
      priority: 200
      entryPoints: [web]
      middlewares: [phantom]
      service: auth
    auth:
      rule: PathPrefix(`/api/v1/auth`)
      entryPoints: [web]
      service: auth
    health:
      rule: PathPrefix(`/health`)
      entryPoints: [web]
      service: urls
    redirect:
      rule: PathPrefix(`/`)
      priority: 1
      entryPoints: [web]
      service: redirects
  middlewares:
    phantom:
      forwardAuth:
        address: https://auth-service-gateway:3005/internal/auth/forward
        trustForwardHeader: false
        authRequestHeaders: [Authorization]
        authResponseHeaders: [Authorization]
        forwardBody: false
        tls:
          ca: /tls/ca.crt
          cert: /tls/client.crt
          key: /tls/client.key
          insecureSkipVerify: false
  services:
    urls:
      loadBalancer:
        servers: [{ url: 'http://url-service:3001' }]
    auth:
      loadBalancer:
        servers: [{ url: 'http://auth-service:3004' }]
    redirects:
      loadBalancer:
        servers: [{ url: 'http://redirect-service:3002' }]
