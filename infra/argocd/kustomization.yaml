apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - namespace.yaml
  - upstream/install.yaml
patches:
  - path: patches/argocd-cm.yaml
    target:
      kind: ConfigMap
      name: argocd-cm
  - path: patches/argocd-server-service.yaml
    target:
      kind: Service
      name: argocd-server
  - path: patches/argocd-server.yaml
    target:
      kind: Deployment
      name: argocd-server
  - path: patches/argocd-repo-server.yaml
    target:
      kind: Deployment
      name: argocd-repo-server
  - path: patches/argocd-application-controller.yaml
    target:
      kind: StatefulSet
      name: argocd-application-controller
  - path: patches/argocd-applicationset-controller.yaml
    target:
      kind: Deployment
      name: argocd-applicationset-controller
  - path: patches/argocd-notifications-controller.yaml
    target:
      kind: Deployment
      name: argocd-notifications-controller
  - path: patches/argocd-dex-server.yaml
    target:
      kind: Deployment
      name: argocd-dex-server
  - path: patches/argocd-redis.yaml
    target:
      kind: Deployment
      name: argocd-redis
