deployment:
  kind: DaemonSet

# A single kind node cannot schedule a second Traefik Pod while hostPort 80/443
# are held by the old Pod. Replace it first during upgrades.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

service:
  spec:
    type: ClusterIP

ports:
  web:
    port: 8000
    hostPort: 80
    expose:
      default: true
    exposedPort: 80
  websecure:
    port: 8443
    hostPort: 443
    expose:
      default: true
    exposedPort: 443

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

nodeSelector:
  ingress-ready: 'true'

ingressRoute:
  dashboard:
    enabled: false
