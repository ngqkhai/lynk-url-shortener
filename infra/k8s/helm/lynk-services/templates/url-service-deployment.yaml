{{- if .Values.urlService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: url-service
    version: {{ .Chart.AppVersion | quote }}
spec:
  replicas: {{ .Values.urlService.replicaCount }}
  selector:
    matchLabels:
      app: url-service
  template:
    metadata:
      labels:
        app: url-service
    spec:
      containers:
        - name: url-service
          image: "{{ .Values.urlService.image.repository }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.urlService.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.urlService.service.port }}
              protocol: TCP
          env:
            {{- range $key, $val := .Values.urlService.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.urlService.database.existingSecret }}
                  key: {{ .Values.urlService.database.secretKey }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.urlService.resources | nindent 12 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
{{- end }}
