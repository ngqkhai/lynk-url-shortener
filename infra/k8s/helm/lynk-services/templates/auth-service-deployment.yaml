{{- if .Values.authService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: auth-service
    version: {{ .Chart.AppVersion | quote }}
spec:
  {{- if .Values.global.lowMemoryRollout }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  {{- end }}
  replicas: {{ .Values.authService.replicaCount }}
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: {{ include "lynk.image" (dict "image" .Values.authService.image "tag" .Values.global.imageTag) | quote }}
          imagePullPolicy: {{ .Values.authService.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.authService.service.port }}
              protocol: TCP
          env:
            {{- range $key, $val := .Values.authService.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authService.database.existingSecret }}
                  key: {{ .Values.authService.database.secretKey }}
            - name: PHANTOM_ENABLED
              value: {{ .Values.phantomToken.enabled | quote }}
          volumeMounts:
            - name: jwt-keys
              mountPath: /keys
              readOnly: true
            {{- if .Values.phantomToken.enabled }}
            - name: gateway-tls
              mountPath: /tls
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            timeoutSeconds: {{ .Values.global.livenessTimeoutSeconds | default 1 }}
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            timeoutSeconds: {{ .Values.global.readinessTimeoutSeconds | default 1 }}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.authService.resources | nindent 12 }}
      volumes:
        - name: jwt-keys
          secret:
            secretName: {{ .Values.phantomToken.jwtSecret }}
            defaultMode: 0444
        {{- if .Values.phantomToken.enabled }}
        - name: gateway-tls
          secret:
            secretName: {{ .Values.phantomToken.serverSecret }}
            defaultMode: 0444
        {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
{{- end }}
