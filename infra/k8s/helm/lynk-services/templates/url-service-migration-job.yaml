{{- if .Values.urlService.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: url-service-migrate
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- if eq .Values.global.migrationHookMode "helm" }}
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    {{- else }}
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    {{- end }}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: url-service-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: migrate
          image: {{ include "lynk.image" (dict "image" .Values.urlService.image "tag" .Values.global.imageTag) | quote }}
          imagePullPolicy: {{ .Values.urlService.image.pullPolicy }}
          command: ["node", "dist/infra/migrate.js"]
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.urlService.database.existingSecret }}
                  key: {{ .Values.urlService.database.secretKey }}
            - name: PUBLIC_BASE_URL
              value: {{ .Values.urlService.env.PUBLIC_BASE_URL | quote }}
{{- end }}
