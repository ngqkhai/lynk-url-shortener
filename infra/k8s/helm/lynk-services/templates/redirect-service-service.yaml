{{- if .Values.redirectService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: redirect-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: redirect-service
spec:
  selector:
    app: redirect-service
  ports:
    - name: http
      port: {{ .Values.redirectService.service.port }}
      targetPort: http
      protocol: TCP
  type: ClusterIP
{{- end }}
