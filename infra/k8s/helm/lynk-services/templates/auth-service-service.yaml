{{- if .Values.authService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: auth-service
spec:
  selector:
    app: auth-service
  ports:
    - name: http
      port: {{ .Values.authService.service.port }}
      targetPort: http
      protocol: TCP
  type: ClusterIP
{{- end }}
