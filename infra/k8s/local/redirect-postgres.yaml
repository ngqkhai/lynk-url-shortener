apiVersion: v1
kind: Service
metadata:
  name: redirect-postgres
spec:
  clusterIP: None
  selector:
    app: redirect-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redirect-postgres
spec:
  serviceName: redirect-postgres
  replicas: 1
  selector:
    matchLabels:
      app: redirect-postgres
  template:
    metadata:
      labels:
        app: redirect-postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: lynk_redirects
            - name: POSTGRES_USER
              value: lynk
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redirect-service-db
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: [pg_isready, -U, lynk, -d, lynk_redirects]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, lynk, -d, lynk_redirects]
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
