# Syntax-check fixture only. Real bootstrap uses executable inventory.py.
# This host ID is invalid so accidentally applying this fixture cannot reach EC2.
all:
  hosts:
    lynk:
      ansible_host: SYNTAX_CHECK_ONLY
      ansible_connection: amazon.aws.aws_ssm
      ansible_aws_ssm_region: ap-southeast-1
      ansible_aws_ssm_bucket_name: syntax-check-only
      ansible_python_interpreter: /usr/bin/python3
      ansible_become: true
      ansible_become_user: root
