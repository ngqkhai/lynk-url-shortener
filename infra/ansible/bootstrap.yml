- name: Converge Lynk host and runtime files without workload reconciliation
  hosts: lynk
  gather_facts: true
  roles:
    - secrets
    - host
  post_tasks:
    - name: Apply notified configuration before final version checks
      ansible.builtin.meta: flush_handlers
    - name: Verify K3s service is active
      ansible.builtin.command: systemctl is-active k3s
      changed_when: false
      when: not ansible_check_mode
