- name: Require controller-supplied Vault runtime directory
  ansible.builtin.assert:
    that: lynk_secrets_dir is defined
    fail_msg: Run scripts/ansible/bootstrap.py to supply the encrypted recovery source

- name: Create protected runtime secret directory
  ansible.builtin.file:
    path: /opt/lynk/secrets
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Inspect existing runtime files without exposing checksums
  ansible.builtin.stat:
    path: '/opt/lynk/secrets/{{ item }}'
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  loop: '{{ runtime_secret_names }}'
  register: runtime_files_before
  no_log: true

- name: Refuse to replace existing mismatched runtime files
  ansible.builtin.assert:
    that:
      - not item.stat.exists or (item.stat.isreg and item.stat.mode == '0600')
      - not item.stat.exists or item.stat.checksum == (lookup('ansible.builtin.file', lynk_secrets_dir + '/' + item.item, rstrip=False) | hash('sha256'))
    fail_msg: Runtime files differ from Vault; use the explicit rotation/recovery procedure
  loop: '{{ runtime_files_before.results }}'
  no_log: true

- name: Supply only missing runtime files from the Vault source
  ansible.builtin.copy:
    src: '{{ lynk_secrets_dir }}/{{ item.item }}'
    dest: '/opt/lynk/secrets/{{ item.item }}'
    mode: '0600'
    force: false
  loop: '{{ runtime_files_before.results }}'
  when: not item.stat.exists
  no_log: true
  diff: false

- name: Verify supplied runtime files after apply
  ansible.builtin.stat:
    path: '/opt/lynk/secrets/{{ item }}'
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  loop: '{{ runtime_secret_names }}'
  register: runtime_files_after
  when: not ansible_check_mode
  no_log: true

- name: Require exact runtime bytes and protected permissions
  ansible.builtin.assert:
    that:
      - item.stat.exists and item.stat.isreg and item.stat.mode == '0600'
      - item.stat.checksum == (lookup('ansible.builtin.file', lynk_secrets_dir + '/' + item.item, rstrip=False) | hash('sha256'))
  loop: '{{ runtime_files_after.results }}'
  when: not ansible_check_mode
  no_log: true
